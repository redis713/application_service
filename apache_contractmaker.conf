# ==============================================================================
# Конфигурация Apache 2.4 для сервиса заявок УМЦ ГОЧС и ПБ Иркутской области
# Разделение на 2 сайта, обращающихся к одному Flask-приложению (127.0.0.1:5000)
# ==============================================================================
#
# Необходимые модули Apache (включить при первоначальной настройке):
#   sudo a2enmod proxy
#   sudo a2enmod proxy_http
#   sudo a2enmod headers
#   sudo a2enmod rewrite
#
# ------------------------------------------------------------------------------
# 1. ПУБЛИЧНЫЙ САЙТ (для подачи заявок организациями и гражданами)
#    Сейчас работает на 192.168.1.21:8009 (или в будущем на внешнем домене)
# ------------------------------------------------------------------------------
<VirtualHost *:8009>
    ServerName 192.168.1.21
    # ServerAlias zayavka.umcgochs.ru

    # Сохраняем реальный Host запроса и помечаем его как публичный
    ProxyPreserveHost On
    RequestHeader set X-Site "public"

    # Проксирование всех запросов в приложение Flask
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Лимит на размер тела запроса (30 МБ для загрузки качественных сканов/PDF)
    LimitRequestBody 31457280

    ErrorLog ${APACHE_LOG_DIR}/umc_public_error.log
    CustomLog ${APACHE_LOG_DIR}/umc_public_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 2. ВНУТРЕННИЙ САЙТ ДЛЯ СОТРУДНИКОВ (Реестр заявок, скачивание docx и сканов)
#    Открывается в локальной сети по адресу: http://contractmaker.umcgochs.local
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName contractmaker.umcgochs.local
    ServerAlias contractmaker.local

    # Сохраняем имя хоста и передаем заголовок X-Site для внутренней авторизации
    ProxyPreserveHost On
    RequestHeader set X-Site "internal"

    # Проксирование всех запросов в то же самое приложение Flask
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Лимит на загрузку
    LimitRequestBody 31457280

    ErrorLog ${APACHE_LOG_DIR}/contractmaker_error.log
    CustomLog ${APACHE_LOG_DIR}/contractmaker_access.log combined
</VirtualHost>
